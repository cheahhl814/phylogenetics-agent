[workspace]
name = "phylogenetics-agent"
version = "1.0.0"
description = "Checkpointed, agent-driven single-marker ML phylogenetics pipeline (align, trim, model-select, tree, render) with swappable tools at each stage and per-stage resume."
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]
# bioconda coverage for modeltest-ng/raxml-ng/iqtree is Linux-only; macOS is not supported.

[dependencies]
# Every tool here was confirmed via `pixi search` during preflight (status: found in params.json).
muscle = "*"
mafft = "*"
trimal = "*"
modeltest-ng = "*"
raxml-ng = "*"
iqtree = "*"
gotree = "*"
toytree = "*"
packaging = "*"  # toyplot's reportlab-based PNG export needs this; not pulled in transitively

[tasks]
# These are documentation entry points, not scripts — each sub-skill's SKILL.md has the
# actual per-stage bash recipes (muscle/mafft, trimal, modeltest-ng, raxml-ng/iqtree, gotree)
# for the agent to run directly. There is no wrapper script to keep in sync.
preflight = "echo 'See preflight/phylo-preflight/SKILL.md for FASTA input validation steps.'"
run = "echo 'See build/phylo-builder/SKILL.md for the align/trim/model_select/tree/render stage recipes.'"
qc = "echo 'See qc/phylo-qc/SKILL.md for the tree-report generation steps.'"
debug = "echo 'See debug/phylo-debug/SKILL.md for the failure signature library.'"
battle-test = "echo 'See battle-test/phylo-battle-test/SKILL.md for the structural smoke tests.'"
